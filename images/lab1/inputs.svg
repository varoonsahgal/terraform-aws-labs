<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 290" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="variables.tf declares, testing.tfvars supplies, main.tf uses, AWS shows the result">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B7186"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="288" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="42" font-size="20" font-weight="700" fill="#0E2233">Declare → Supply → Use</text>

  <!-- variables.tf -->
  <rect x="32" y="66" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="2"/>
  <text x="48" y="90" font-size="14" font-weight="700" fill="#1F5FAE">variables.tf · DECLARE</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0E2233">
    <text x="48" y="114">variable "user_id" {</text>
    <text x="48" y="132">  type = string</text>
    <text x="48" y="148">}</text>
  </g>
  <!-- tfvars -->
  <rect x="32" y="172" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#E2702B" stroke-width="2"/>
  <text x="48" y="196" font-size="14" font-weight="700" fill="#B4521A">testing.tfvars · SUPPLY</text>
  <text x="48" y="228" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0E2233">user_id = <tspan fill="#B4521A" font-weight="700">"user07"</tspan></text>

  <!-- main.tf -->
  <rect x="330" y="96" width="350" height="128" rx="10" fill="#FFFFFF" stroke="#0E2233" stroke-width="2"/>
  <text x="346" y="122" font-size="14" font-weight="700" fill="#0E2233">main.tf · USE</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0E2233">
    <text x="346" y="150">tags = {</text>
    <text x="346" y="170">  Name = "<tspan fill="#B4521A" font-weight="700">${var.user_id}</tspan>-terraform-</text>
    <text x="346" y="188">          app-server"</text>
    <text x="346" y="208">}</text>
  </g>

  <!-- AWS -->
  <rect x="728" y="96" width="200" height="128" rx="10" fill="#EAF6EF" stroke="#2E8B57" stroke-width="2"/>
  <text x="744" y="122" font-size="14" font-weight="700" fill="#22703F">AWS Console · RESULT</text>
  <rect x="744" y="138" width="168" height="58" rx="6" fill="#FFFFFF" stroke="#9ACDB0"/>
  <text x="756" y="158" font-size="11" fill="#3E5468">EC2 · Name</text>
  <text x="756" y="178" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#0E2233"><tspan fill="#B4521A" font-weight="700">user07</tspan>-terraform-</text>
  <text x="756" y="192" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#0E2233">app-server</text>

  <g stroke="#5B7186" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M282,110 C305,110 305,140 328,140"/>
    <path d="M282,212 C305,212 305,180 328,180"/>
    <line x1="680" y1="160" x2="726" y2="160"/>
  </g>
  <text x="480" y="262" font-size="13" fill="#3E5468" text-anchor="middle">Same main.tf for everyone. Only the value in testing.tfvars changes.</text>
</svg>
