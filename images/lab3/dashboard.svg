<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Preview of the ops dashboard: three ride widgets showing riders in line and riders who gave up after a breakdown">
  <rect x="1" y="1" width="958" height="298" rx="16" fill="#1B1230"/>
  <text x="28" y="36" font-size="15" font-weight="700" fill="#FFFFFF">user07-park-ops</text>
  <text x="932" y="36" font-size="11" fill="#9A86B8" text-anchor="end">CloudWatch dashboard · generated by a for expression</text>

  <!-- widget 1 coaster -->
  <rect x="24" y="54" width="296" height="222" rx="8" fill="#26193F"/>
  <text x="40" y="80" font-size="13" font-weight="700" fill="#FFFFFF">COASTER ★★★★★</text>
  <g stroke="#3B2C58"><line x1="40" y1="110" x2="304" y2="110"/><line x1="40" y1="160" x2="304" y2="160"/><line x1="40" y1="210" x2="304" y2="210"/><line x1="40" y1="246" x2="304" y2="246"/></g>
  <path d="M40,246 L80,246 L100,128 L170,128 L200,170 L230,214 L260,240 L304,244" fill="none" stroke="#EE4266" stroke-width="3"/>
  <path d="M40,246 L170,246 L200,224 L230,190 L260,170 L304,166" fill="none" stroke="#8B8B8B" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="100" cy="128" r="4" fill="#EE4266"/>
  <text x="104" y="120" font-size="10.5" fill="#F8B4C4">rush hour: 25</text>
  <text x="214" y="160" font-size="10.5" fill="#CFCFCF">breakdown →</text>
  <g font-size="10.5"><rect x="40" y="258" width="10" height="4" fill="#EE4266"/><text x="54" y="263" fill="#D9C8F0">in line</text><rect x="104" y="258" width="10" height="4" fill="#8B8B8B"/><text x="118" y="263" fill="#D9C8F0">gave up</text></g>

  <!-- widget 2 carousel -->
  <rect x="332" y="54" width="296" height="222" rx="8" fill="#26193F"/>
  <text x="348" y="80" font-size="13" font-weight="700" fill="#FFFFFF">CAROUSEL ★</text>
  <g stroke="#3B2C58"><line x1="348" y1="110" x2="612" y2="110"/><line x1="348" y1="160" x2="612" y2="160"/><line x1="348" y1="210" x2="612" y2="210"/><line x1="348" y1="246" x2="612" y2="246"/></g>
  <path d="M348,246 L612,246" fill="none" stroke="#3BCEAC" stroke-width="3"/>
  <text x="480" y="196" font-size="11" fill="#9A86B8" text-anchor="middle">quiet day</text>

  <!-- widget 3 ferris -->
  <rect x="640" y="54" width="296" height="222" rx="8" fill="#26193F"/>
  <text x="656" y="80" font-size="13" font-weight="700" fill="#FFFFFF">FERRIS-WHEEL ★★</text>
  <g stroke="#3B2C58"><line x1="656" y1="110" x2="920" y2="110"/><line x1="656" y1="160" x2="920" y2="160"/><line x1="656" y1="210" x2="920" y2="210"/><line x1="656" y1="246" x2="920" y2="246"/></g>
  <path d="M656,246 L760,246 L790,226 L840,226 L880,240 L920,240" fill="none" stroke="#E2702B" stroke-width="3"/>
  <text x="788" y="216" font-size="10.5" fill="#F5C29B">a few riders</text>
</svg>
