<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The ride module: five inputs go in; inside, a line queue redrives to an exit queue and a sign parameter records the ride; five outputs come out">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B4A6E"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#FBF6EE" stroke="#E7D9C4" stroke-width="2"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#2A0E4A">Inside <tspan font-family="Menlo, Consolas, monospace">modules/ride</tspan></text>

  <!-- inputs -->
  <text x="32" y="74" font-size="11" font-weight="700" fill="#B0294A" letter-spacing="1.2">INPUTS · variables.tf</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#2A0E4A">
    <rect x="32" y="86" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#EE4266" stroke-width="1.5"/><text x="48" y="106">park_prefix</text>
    <rect x="32" y="124" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#EE4266" stroke-width="1.5"/><text x="48" y="144">ride_name</text>
    <rect x="32" y="162" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#EE4266" stroke-width="1.5"/><text x="48" y="182">thrill  1–5 ✓</text>
    <rect x="32" y="200" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#EE4266" stroke-width="1.5"/><text x="48" y="220">color   #hex ✓</text>
    <rect x="32" y="238" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#EE4266" stroke-width="1.5"/><text x="48" y="258">max_tries</text>
  </g>

  <!-- module box -->
  <rect x="250" y="60" width="440" height="240" rx="16" fill="#2A0E4A"/>
  <text x="270" y="88" font-size="12" font-weight="700" fill="#FFD23F" letter-spacing="1.2">main.tf · HIDDEN FROM CALLERS</text>
  <!-- line queue -->
  <rect x="270" y="106" width="190" height="80" rx="10" fill="#3B1D5E" stroke="#3BCEAC" stroke-width="2"/>
  <text x="286" y="130" font-size="13" font-weight="700" fill="#FFFFFF">aws_sqs_queue.line</text>
  <g fill="#3BCEAC"><circle cx="294" cy="160" r="9"/><circle cx="318" cy="160" r="9"/><circle cx="342" cy="160" r="9"/><circle cx="366" cy="160" r="9"/><circle cx="390" cy="160" r="9"/></g>
  <text x="414" y="165" font-size="11" fill="#D9C8F0">riders</text>
  <!-- exit -->
  <rect x="490" y="106" width="180" height="80" rx="10" fill="#3B1D5E" stroke="#9A86B8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="506" y="130" font-size="13" font-weight="700" fill="#FFFFFF">aws_sqs_queue.exit</text>
  <text x="506" y="150" font-size="11" fill="#D9C8F0">dead-letter queue</text>
  <g fill="#9A86B8"><circle cx="514" cy="170" r="7"/><circle cx="532" cy="170" r="7"/></g>
  <path d="M460,146 L486,146" stroke="#FFD23F" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="473" y="208" font-size="10.5" fill="#FFD23F" text-anchor="middle" font-family="Menlo, Consolas, monospace">redrive after</text>
  <text x="473" y="222" font-size="10.5" fill="#FFD23F" text-anchor="middle" font-family="Menlo, Consolas, monospace">max_tries</text>
  <!-- sign -->
  <rect x="270" y="236" width="400" height="48" rx="10" fill="#FFD23F"/>
  <text x="286" y="257" font-size="12.5" font-weight="700" fill="#2A0E4A">aws_ssm_parameter.sign</text>
  <text x="286" y="275" font-size="11" fill="#2A0E4A" font-family="Menlo, Consolas, monospace">/user07-park/rides/coaster → {"thrill":5,…}</text>

  <!-- outputs -->
  <text x="736" y="74" font-size="11" font-weight="700" fill="#1F8A6B" letter-spacing="1.2">OUTPUTS · outputs.tf</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#2A0E4A">
    <rect x="736" y="86" width="190" height="30" rx="15" fill="#FFFFFF" stroke="#3BCEAC" stroke-width="1.5"/><text x="752" y="106">line_name</text>
    <rect x="736" y="124" width="190" height="30" rx="15" fill="#FFFFFF" stroke="#3BCEAC" stroke-width="1.5"/><text x="752" y="144">line_url</text>
    <rect x="736" y="162" width="190" height="30" rx="15" fill="#FFFFFF" stroke="#3BCEAC" stroke-width="1.5"/><text x="752" y="182">exit_name</text>
    <rect x="736" y="200" width="190" height="30" rx="15" fill="#FFFFFF" stroke="#3BCEAC" stroke-width="1.5"/><text x="752" y="220">color</text>
    <rect x="736" y="238" width="190" height="30" rx="15" fill="#FFFFFF" stroke="#3BCEAC" stroke-width="1.5"/><text x="752" y="258">sign "COASTER ★★★★★"</text>
  </g>
  <path d="M202,176 L246,176" stroke="#5B4A6E" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M690,176 L732,176" stroke="#5B4A6E" stroke-width="2.5" marker-end="url(#ar)"/>
</svg>
