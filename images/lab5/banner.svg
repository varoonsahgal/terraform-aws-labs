<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Launch Day: the blue/green boss battle, Terraform Lab 5">
  <defs>
    <clipPath id="c"><rect width="960" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="960" height="320" fill="#0F2C55"/>
    <polygon points="560,0 960,0 960,320 400,320" fill="#0F4A35"/>
    <g opacity=".14" stroke="#FFFFFF" stroke-width="1">
      <path d="M0 64 H960 M0 128 H960 M0 192 H960 M0 256 H960"/>
    </g>
  </g>
  <!-- dial -->
  <g transform="translate(180 190)">
    <path d="M-130,0 A130,130 0 0 1 130,0" fill="none" stroke="#1F5FAE" stroke-width="26"/>
    <path d="M0,-130 A130,130 0 0 1 130,0" fill="none" stroke="#2E8B57" stroke-width="26"/>
    <g stroke="#FFFFFF" stroke-width="3">
      <line x1="-130" y1="0" x2="-110" y2="0"/><line x1="0" y1="-130" x2="0" y2="-110"/><line x1="130" y1="0" x2="110" y2="0"/>
      <line x1="-92" y1="-92" x2="-78" y2="-78"/><line x1="92" y1="-92" x2="78" y2="-78"/>
    </g>
    <line x1="0" y1="0" x2="62" y2="-88" stroke="#FFD23F" stroke-width="7" stroke-linecap="round"/>
    <circle r="16" fill="#FFD23F"/>
    <text x="-130" y="34" font-size="13" font-weight="800" fill="#8EC1FF" text-anchor="middle">100 BLUE</text>
    <text x="130" y="34" font-size="13" font-weight="800" fill="#8FE0B3" text-anchor="middle">100 GREEN</text>
    <text x="0" y="56" font-size="12" fill="#C9D8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">var.traffic</text>
  </g>
  <text x="380" y="88" font-size="16" font-weight="700" fill="#FFD23F" letter-spacing="4">TERRAFORM LAB 5 · UNGUIDED</text>
  <text x="378" y="152" font-size="64" font-weight="800" fill="#FFFFFF">LAUNCH DAY</text>
  <text x="380" y="194" font-size="24" font-weight="700" fill="#8EC1FF">The Blue<tspan fill="#FFFFFF">/</tspan><tspan fill="#8FE0B3">Green</tspan> Boss Battle</text>
  <g font-size="12.5" font-weight="700" letter-spacing="1">
    <rect x="380" y="226" width="164" height="28" rx="14" fill="none" stroke="#FFD23F" stroke-width="2"/><text x="462" y="245" fill="#FFD23F" text-anchor="middle">12 REQUIREMENTS</text>
    <rect x="554" y="226" width="158" height="28" rx="14" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="633" y="245" fill="#FFFFFF" text-anchor="middle">0 SECONDS DOWN</text>
    <rect x="722" y="226" width="164" height="28" rx="14" fill="none" stroke="#8FE0B3" stroke-width="2"/><text x="804" y="245" fill="#8FE0B3" text-anchor="middle">1-LINE ROLLBACK</text>
  </g>
</svg>
