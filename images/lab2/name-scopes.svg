<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="How unique must a name be? Tag names: not enforced. Security group names: per VPC. S3 bucket names: globally across all AWS accounts.">
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0E2233">How unique does the name have to be?</text>
  <g font-size="11" font-weight="700" letter-spacing="1.2" fill="#5B7186">
    <text x="32" y="74">NAME</text><text x="262" y="74">MUST BE UNIQUE ACROSS…</text><text x="640" y="74">IF TWO PEOPLE PICK THE SAME NAME</text>
  </g>

  <!-- row 1 -->
  <rect x="24" y="88" width="912" height="66" rx="10" fill="#FFFFFF" stroke="#D3DEEA"/>
  <text x="40" y="117" font-size="15" font-weight="700" fill="#0E2233">EC2 Name tag</text>
  <text x="40" y="138" font-size="12" fill="#5B7186" font-family="Menlo, Consolas, monospace">tags = { Name = … }</text>
  <rect x="262" y="108" width="40" height="24" rx="6" fill="#DCE6F0"/>
  <text x="312" y="125" font-size="13" fill="#3E5468">nothing — it's just a label</text>
  <text x="640" y="117" font-size="13" fill="#0E2233">Works, but nobody can tell</text>
  <text x="640" y="136" font-size="13" fill="#0E2233">whose server is whose.</text>

  <!-- row 2 -->
  <rect x="24" y="164" width="912" height="66" rx="10" fill="#FFFFFF" stroke="#D3DEEA"/>
  <text x="40" y="193" font-size="15" font-weight="700" fill="#0E2233">Security group name</text>
  <text x="40" y="214" font-size="12" fill="#5B7186" font-family="Menlo, Consolas, monospace">name = "…"</text>
  <rect x="262" y="184" width="160" height="24" rx="6" fill="#F7C9A6"/>
  <text x="432" y="201" font-size="13" fill="#3E5468">one VPC</text>
  <text x="640" y="193" font-size="13" fill="#B4521A" font-weight="700" font-family="Menlo, Consolas, monospace">InvalidGroup.Duplicate</text>
  <text x="640" y="212" font-size="13" fill="#0E2233">Second person's apply fails.</text>

  <!-- row 3 -->
  <rect x="24" y="240" width="912" height="66" rx="10" fill="#FFFFFF" stroke="#D3DEEA"/>
  <text x="40" y="269" font-size="15" font-weight="700" fill="#0E2233">S3 bucket name</text>
  <text x="40" y="290" font-size="12" fill="#5B7186" font-family="Menlo, Consolas, monospace">bucket = "…"</text>
  <rect x="262" y="260" width="300" height="24" rx="6" fill="#C0392B"/>
  <text x="412" y="277" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EVERY AWS ACCOUNT ON EARTH</text>
  <text x="640" y="269" font-size="13" fill="#A23024" font-weight="700" font-family="Menlo, Consolas, monospace">BucketAlreadyExists</text>
  <text x="640" y="288" font-size="13" fill="#0E2233">Even a stranger can take your name.</text>
</svg>
