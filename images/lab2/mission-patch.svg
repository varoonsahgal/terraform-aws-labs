<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Operation Beacon: Terraform Lab 2 mission patch">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A2A"/><stop offset="1" stop-color="#173452"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#E2702B"/>
    </linearGradient>
  </defs>
  <rect width="960" height="320" rx="18" fill="url(#sky)"/>
  <g fill="#FFFFFF">
    <circle cx="340" cy="40" r="1.6" opacity=".8"/><circle cx="420" cy="90" r="1.2" opacity=".6"/><circle cx="520" cy="30" r="2" opacity=".9"/>
    <circle cx="610" cy="70" r="1.3" opacity=".7"/><circle cx="700" cy="36" r="1.8" opacity=".8"/><circle cx="810" cy="80" r="1.2" opacity=".6"/>
    <circle cx="900" cy="44" r="1.6" opacity=".8"/><circle cx="880" cy="270" r="1.4" opacity=".6"/><circle cx="760" cy="290" r="1.2" opacity=".5"/>
    <circle cx="360" cy="280" r="1.5" opacity=".6"/><circle cx="930" cy="160" r="1.2" opacity=".7"/><circle cx="40" cy="30" r="1.4" opacity=".7"/>
  </g>

  <!-- patch -->
  <circle cx="165" cy="160" r="128" fill="#102A44" stroke="#E2702B" stroke-width="8"/>
  <circle cx="165" cy="160" r="112" fill="none" stroke="#6FB1FF" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- pulsing rings -->
  <circle cx="165" cy="160" r="70" fill="none" stroke="#6FB1FF" stroke-width="2" opacity=".35"/>
  <circle cx="165" cy="160" r="92" fill="none" stroke="#6FB1FF" stroke-width="2" opacity=".2"/>
  <!-- rocket -->
  <g transform="translate(165 160) rotate(35)">
    <path d="M0,-70 C22,-48 24,-6 18,30 L-18,30 C-24,-6 -22,-48 0,-70 Z" fill="#F2F6FA"/>
    <circle cx="0" cy="-24" r="11" fill="#6FB1FF" stroke="#0B1A2A" stroke-width="4"/>
    <path d="M-18,8 L-36,40 L-18,32 Z" fill="#E2702B"/>
    <path d="M18,8 L36,40 L18,32 Z" fill="#E2702B"/>
    <path d="M-12,30 L0,66 L12,30 Z" fill="url(#flame)"/>
  </g>
  <path id="arc" d="M75,160 A90,90 0 0 1 255,160" fill="none"/>
  <text font-size="15" font-weight="700" fill="#FFD27A" letter-spacing="3"><textPath href="#arc" startOffset="50%" text-anchor="middle">TERRAFORM · LAB 2</textPath></text>

  <!-- title -->
  <text x="330" y="132" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="2">OPERATION</text>
  <text x="330" y="196" font-size="58" font-weight="800" fill="#E2702B" letter-spacing="2">BEACON</text>
  <text x="332" y="236" font-size="18" fill="#C9D8E8">Launch a web beacon, a black-box bucket, and a small fleet —</text>
  <text x="332" y="260" font-size="18" fill="#C9D8E8">in a shared AWS account, without a single name collision.</text>
  <g font-size="13" font-weight="700" letter-spacing="1.5">
    <rect x="332" y="276" width="116" height="26" rx="13" fill="#173452" stroke="#6FB1FF"/>
    <text x="390" y="294" fill="#6FB1FF" text-anchor="middle">~60 MINUTES</text>
    <rect x="458" y="276" width="104" height="26" rx="13" fill="#173452" stroke="#6FB1FF"/>
    <text x="510" y="294" fill="#6FB1FF" text-anchor="middle">7 MISSIONS</text>
    <rect x="572" y="276" width="146" height="26" rx="13" fill="#173452" stroke="#FFD27A"/>
    <text x="645" y="294" fill="#FFD27A" text-anchor="middle">0 COLLISIONS</text>
  </g>
</svg>
