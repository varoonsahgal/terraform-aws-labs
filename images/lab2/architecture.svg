<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 450" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Target architecture: beacons in the default VPC behind a security group, plus an S3 black-box bucket">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B7186"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E2702B"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="448" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#0E2233">What you will build (example: user07, 2 beacons)</text>

  <!-- left actors -->
  <rect x="30" y="100" width="170" height="92" rx="10" fill="#FFFFFF" stroke="#E2702B" stroke-width="2"/>
  <rect x="30" y="100" width="170" height="20" rx="10" fill="#E2702B"/><rect x="30" y="110" width="170" height="10" fill="#E2702B"/>
  <circle cx="44" cy="110" r="3" fill="#FFFFFF"/><circle cx="54" cy="110" r="3" fill="#FFFFFF"/><circle cx="64" cy="110" r="3" fill="#FFFFFF"/>
  <text x="115" y="146" font-size="14" font-weight="700" fill="#0E2233" text-anchor="middle">Your browser</text>
  <text x="115" y="170" font-size="12" fill="#3E5468" text-anchor="middle" font-family="Menlo, Consolas, monospace">http://&lt;public-ip&gt;</text>

  <rect x="30" y="300" width="170" height="92" rx="10" fill="#0E2233"/>
  <text x="46" y="326" font-size="12" fill="#6FB1FF" font-family="Menlo, Consolas, monospace">$ terraform apply</text>
  <text x="46" y="346" font-size="12" fill="#9ACDB0" font-family="Menlo, Consolas, monospace">Apply complete!</text>
  <text x="115" y="378" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your VM</text>

  <!-- account -->
  <rect x="230" y="60" width="700" height="370" rx="14" fill="#FFFFFF" stroke="#0E2233" stroke-width="2"/>
  <text x="250" y="84" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0E2233">SHARED AWS ACCOUNT · us-west-2</text>

  <!-- VPC -->
  <rect x="252" y="100" width="420" height="310" rx="12" fill="#F2F6FA" stroke="#5B7186" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="268" y="122" font-size="12" fill="#3E5468"><tspan font-weight="700">default VPC</tspan> · shared · looked up with a data source</text>

  <!-- SG -->
  <rect x="272" y="138" width="380" height="252" rx="10" fill="#FFF8F2" stroke="#E2702B" stroke-width="2.5"/>
  <text x="288" y="160" font-size="12.5" font-weight="700" fill="#B4521A" font-family="Menlo, Consolas, monospace">user07-lab2-beacon-sg</text>
  <text x="636" y="160" font-size="12" fill="#B4521A" text-anchor="end">in: tcp/80 · out: all</text>

  <!-- subnets / beacons -->
  <g>
    <rect x="290" y="176" width="168" height="196" rx="8" fill="#FFFFFF" stroke="#C7D5E4"/>
    <text x="374" y="196" font-size="11" fill="#5B7186" text-anchor="middle">subnet · us-west-2a</text>
    <rect x="306" y="210" width="136" height="146" rx="8" fill="#E8F0FA" stroke="#1F5FAE" stroke-width="2"/>
    <circle cx="374" cy="252" r="24" fill="#E2702B"/><circle cx="374" cy="252" r="32" fill="none" stroke="#E2702B" opacity=".4" stroke-width="2"/>
    <text x="374" y="259" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="374" y="306" font-size="11" fill="#0E2233" text-anchor="middle" font-family="Menlo, Consolas, monospace">beacon[0]</text>
    <text x="374" y="324" font-size="10.5" fill="#1F5FAE" text-anchor="middle" font-family="Menlo, Consolas, monospace">user07-lab2-</text>
    <text x="374" y="338" font-size="10.5" fill="#1F5FAE" text-anchor="middle" font-family="Menlo, Consolas, monospace">beacon-1</text>
  </g>
  <g>
    <rect x="468" y="176" width="168" height="196" rx="8" fill="#FFFFFF" stroke="#C7D5E4"/>
    <text x="552" y="196" font-size="11" fill="#5B7186" text-anchor="middle">subnet · us-west-2b</text>
    <rect x="484" y="210" width="136" height="146" rx="8" fill="#E8F0FA" stroke="#1F5FAE" stroke-width="2"/>
    <circle cx="552" cy="252" r="24" fill="#E2702B"/><circle cx="552" cy="252" r="32" fill="none" stroke="#E2702B" opacity=".4" stroke-width="2"/>
    <text x="552" y="259" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="552" y="306" font-size="11" fill="#0E2233" text-anchor="middle" font-family="Menlo, Consolas, monospace">beacon[1]</text>
    <text x="552" y="324" font-size="10.5" fill="#1F5FAE" text-anchor="middle" font-family="Menlo, Consolas, monospace">user07-lab2-</text>
    <text x="552" y="338" font-size="10.5" fill="#1F5FAE" text-anchor="middle" font-family="Menlo, Consolas, monospace">beacon-2</text>
  </g>

  <!-- S3 -->
  <rect x="694" y="138" width="216" height="168" rx="10" fill="#EAF6EF" stroke="#2E8B57" stroke-width="2"/>
  <text x="710" y="160" font-size="12" font-weight="700" fill="#22703F" letter-spacing="1">S3 · GLOBAL NAMESPACE</text>
  <path d="M740,178 L864,178 L852,250 Q802,262 752,250 Z" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/>
  <ellipse cx="802" cy="178" rx="62" ry="10" fill="#D6EEDF" stroke="#2E8B57" stroke-width="2"/>
  <rect x="772" y="198" width="60" height="34" rx="4" fill="#F5F8FB" stroke="#3E5468"/>
  <text x="802" y="219" font-size="9.5" fill="#0E2233" text-anchor="middle" font-family="Menlo, Consolas, monospace">.json</text>
  <text x="802" y="278" font-size="11" fill="#0E2233" text-anchor="middle" font-family="Menlo, Consolas, monospace">user07-lab2-blackbox-</text>
  <text x="802" y="294" font-size="11" fill="#22703F" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">happy-panda</text>

  <!-- tags -->
  <rect x="694" y="334" width="216" height="80" rx="10" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="710" y="354" font-size="12" font-weight="700" fill="#1F5FAE">default_tags on everything</text>
  <g font-size="11" font-family="Menlo, Consolas, monospace" fill="#0E2233">
    <text x="710" y="372">Owner     = user07</text>
    <text x="710" y="388">Project   = operation-beacon</text>
    <text x="710" y="404">ManagedBy = terraform</text>
  </g>

  <!-- arrows -->
  <path d="M200,150 C240,150 250,240 304,262" fill="none" stroke="#E2702B" stroke-width="2.5" marker-end="url(#aro)"/>
  <text x="115" y="236" font-size="12" fill="#B4521A" font-weight="700" text-anchor="middle">HTTP :80 →</text>
  <path d="M200,346 C214,346 220,346 230,346" fill="none" stroke="#5B7186" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="140" y="420" font-size="11" fill="#5B7186" text-anchor="middle">AWS API calls</text>
  <path d="M620,250 C664,250 660,222 692,222" fill="none" stroke="#2E8B57" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="802" y="322" font-size="11" fill="#22703F" text-anchor="middle">↑ beacon IPs logged to S3</text>
</svg>
