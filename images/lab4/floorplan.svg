<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 250" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Museum floor plan: lobby, recovery room, restoration, archive, security, test lab">
  <rect x="1" y="1" width="958" height="248" rx="16" fill="#F7F3EC" stroke="#E2D8C6" stroke-width="2"/>
  <text x="32" y="36" font-size="17" font-weight="700" fill="#2C2133">Museum floor plan</text>
  <g>
    <rect x="24" y="56" width="140" height="150" fill="#FFFFFF" stroke="#2C2133" stroke-width="2.5"/>
    <rect x="164" y="56" width="152" height="150" fill="#FFF5DA" stroke="#2C2133" stroke-width="2.5"/>
    <rect x="316" y="56" width="152" height="150" fill="#F1E6F5" stroke="#2C2133" stroke-width="2.5"/>
    <rect x="468" y="56" width="140" height="150" fill="#E9EEF6" stroke="#2C2133" stroke-width="2.5"/>
    <rect x="608" y="56" width="164" height="150" fill="#FBE7E3" stroke="#2C2133" stroke-width="2.5"/>
    <rect x="772" y="56" width="164" height="150" fill="#E6F4EE" stroke="#2C2133" stroke-width="2.5"/>
  </g>
  <!-- doorways -->
  <g fill="#F7F3EC"><rect x="160" y="116" width="8" height="30"/><rect x="312" y="116" width="8" height="30"/><rect x="464" y="116" width="8" height="30"/><rect x="604" y="116" width="8" height="30"/><rect x="768" y="116" width="8" height="30"/></g>
  <g font-size="11" font-weight="700" fill="#7A6A80" letter-spacing="1.2">
    <text x="40" y="80">PART 0–1</text><text x="180" y="80">PART 2</text><text x="332" y="80">PART 3</text><text x="484" y="80">PART 4</text><text x="624" y="80">PART 5</text><text x="788" y="80">PART 6</text>
  </g>
  <g font-size="15" font-weight="700" fill="#2C2133">
    <text x="40" y="106">Lobby</text><text x="180" y="106">Recovery</text><text x="332" y="106">Restoration</text><text x="484" y="106">Archive</text><text x="624" y="106">Security</text><text x="788" y="106">Test lab</text>
  </g>
  <g font-size="12" fill="#2C2133" font-family="Menlo, Consolas, monospace">
    <text x="40" y="160">backend.hcl</text><text x="40" y="178">ClickOps mess</text>
    <text x="180" y="160">import { }</text><text x="180" y="178">-generate-config</text>
    <text x="332" y="160">moved { }</text><text x="332" y="178">→ module</text>
    <text x="484" y="160">removed { }</text><text x="484" y="178">destroy=false</text>
    <text x="624" y="160">precondition</text><text x="624" y="178">postcondition</text><text x="624" y="196">check { }</text>
    <text x="788" y="160">terraform test</text><text x="788" y="178">mock_provider</text>
  </g>
  <text x="480" y="232" font-size="12" fill="#7A6A80" text-anchor="middle">Walk through in order. Each room depends on the one before it.</text>
</svg>
