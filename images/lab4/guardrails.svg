<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 270" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Guardrail timeline: variable validation, precondition, plan and apply, postcondition, and check blocks that warn on every run">
  <rect x="1" y="1" width="958" height="268" rx="16" fill="#F7F3EC" stroke="#E2D8C6" stroke-width="2"/>
  <text x="32" y="36" font-size="17" font-weight="700" fill="#2C2133">Where each guardrail fires</text>
  <line x1="40" y1="130" x2="920" y2="130" stroke="#2C2133" stroke-width="3"/>
  <polygon points="920,122 936,130 920,138" fill="#2C2133"/>
  <text x="40" y="156" font-size="11" fill="#7A6A80">inputs read</text>
  <text x="900" y="156" font-size="11" fill="#7A6A80" text-anchor="end">done</text>

  <g>
    <circle cx="130" cy="130" r="16" fill="#C0392B"/><text x="130" y="135" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="800">✋</text>
    <text x="130" y="82" font-size="13" font-weight="800" fill="#2C2133" text-anchor="middle">validation</text>
    <text x="130" y="100" font-size="11" fill="#7A6A80" text-anchor="middle">one variable</text>
    <text x="130" y="186" font-size="11" fill="#A23024" text-anchor="middle" font-weight="700">BLOCKS</text>
    <text x="130" y="204" font-size="11" fill="#7A6A80" text-anchor="middle">retention 999? no.</text>
  </g>
  <g>
    <circle cx="320" cy="130" r="16" fill="#C0392B"/><text x="320" y="135" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="800">✋</text>
    <text x="320" y="82" font-size="13" font-weight="800" fill="#2C2133" text-anchor="middle">precondition</text>
    <text x="320" y="100" font-size="11" fill="#7A6A80" text-anchor="middle">many inputs + data</text>
    <text x="320" y="186" font-size="11" fill="#A23024" text-anchor="middle" font-weight="700">BLOCKS</text>
    <text x="320" y="204" font-size="11" fill="#7A6A80" text-anchor="middle">wrong Region? fragile + 24h?</text>
  </g>
  <g>
    <rect x="440" y="112" width="120" height="36" rx="18" fill="#2C2133"/><text x="500" y="135" font-size="12" fill="#E2B04A" text-anchor="middle" font-weight="700">create / read</text>
  </g>
  <g>
    <circle cx="680" cy="130" r="16" fill="#C0392B"/><text x="680" y="135" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="800">✋</text>
    <text x="680" y="82" font-size="13" font-weight="800" fill="#2C2133" text-anchor="middle">postcondition</text>
    <text x="680" y="100" font-size="11" fill="#7A6A80" text-anchor="middle">checks self (the result)</text>
    <text x="680" y="186" font-size="11" fill="#A23024" text-anchor="middle" font-weight="700">BLOCKS</text>
    <text x="680" y="204" font-size="11" fill="#7A6A80" text-anchor="middle">is it encrypted?</text>
  </g>
  <g>
    <circle cx="850" cy="130" r="16" fill="#E2B04A"/><text x="850" y="136" font-size="15" fill="#2C2133" text-anchor="middle" font-weight="800">!</text>
    <text x="850" y="82" font-size="13" font-weight="800" fill="#2C2133" text-anchor="middle">check { }</text>
    <text x="850" y="100" font-size="11" fill="#7A6A80" text-anchor="middle">every plan &amp; apply</text>
    <text x="850" y="186" font-size="11" fill="#8A6516" text-anchor="middle" font-weight="700">WARNS ONLY</text>
    <text x="850" y="204" font-size="11" fill="#7A6A80" text-anchor="middle">tag removed? site down?</text>
  </g>
  <rect x="24" y="222" width="912" height="32" rx="8" fill="#FFFFFF" stroke="#E2D8C6"/>
  <text x="480" y="243" font-size="12" fill="#2C2133" text-anchor="middle">Locked doors stop a bad change. A smoke alarm tells you something changed. You need both.</text>
</svg>
