<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 280" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Import flow: a real object in AWS plus an import block; plan with generate-config-out writes a draft; you tidy it; apply records it in state">
