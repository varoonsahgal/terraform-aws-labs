<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 280" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Cache timeline: S3 is updated but the edge keeps serving the old copy until the TTL expires or an invalidation clears it">
  <rect x="1" y="1" width="958" height="278" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0E2233">The ghost in the cache</text>

  <!-- lanes -->
  <text x="32" y="96" font-size="13" font-weight="700" fill="#22703F">S3 (origin)</text>
  <text x="32" y="166" font-size="13" font-weight="700" fill="#B4521A">Edge cache</text>
  <line x1="150" y1="92" x2="930" y2="92" stroke="#C7D5E4" stroke-width="2"/>
  <line x1="150" y1="162" x2="930" y2="162" stroke="#C7D5E4" stroke-width="2"/>

  <!-- S3 versions -->
  <rect x="150" y="76" width="260" height="32" rx="6" fill="#DCE6F0"/>
  <text x="280" y="97" font-size="12" fill="#0E2233" text-anchor="middle" font-family="Menlo, Consolas, monospace">001200</text>
  <rect x="410" y="76" width="520" height="32" rx="6" fill="#2E8B57"/>
  <text x="670" y="97" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="700">999999 (you ran s3 sync)</text>

  <!-- edge -->
  <rect x="150" y="146" width="520" height="32" rx="6" fill="#F7C9A6"/>
  <text x="410" y="167" font-size="12" fill="#8A3E12" text-anchor="middle" font-family="Menlo, Consolas, monospace">001200 · cached · "Hit from cloudfront"</text>
  <rect x="670" y="146" width="260" height="32" rx="6" fill="#2E8B57"/>
  <text x="800" y="167" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="700">999999</text>

  <!-- stale zone -->
  <rect x="410" y="120" width="260" height="18" rx="4" fill="#FBECEA"/>
  <text x="540" y="133" font-size="11" font-weight="700" fill="#A23024" text-anchor="middle">STALE: visitors still see 001200</text>

  <!-- markers -->
  <line x1="670" y1="70" x2="670" y2="190" stroke="#0E2233" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="670" y="212" font-size="12" font-weight="700" fill="#0E2233" text-anchor="middle">invalidation, or TTL expires</text>
  <text x="670" y="230" font-size="11" fill="#5B7186" text-anchor="middle">(CachingOptimized default TTL: 24 hours)</text>
  <text x="480" y="262" font-size="12.5" fill="#3E5468" text-anchor="middle">Shrink the stale window for good with <tspan font-family="Menlo, Consolas, monospace" fill="#0E2233">Cache-Control: max-age=60</tspan> on index.html.</text>
</svg>
