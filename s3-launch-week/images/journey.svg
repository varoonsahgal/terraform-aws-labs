<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Request journey: viewer request, CloudFront Function rewrites the URL, cache check, on a miss CloudFront signs the request with OAC and S3 checks the bucket policy">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B7186"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="298" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0E2233">The journey of GET /about</text>

  <g text-anchor="middle">
    <rect x="28" y="70" width="140" height="96" rx="10" fill="#0E2233"/>
    <text x="98" y="102" font-size="13" font-weight="700" fill="#FFFFFF">Viewer</text>
    <text x="98" y="126" font-size="11" fill="#C9D8E8" font-family="Menlo, Consolas, monospace">GET /about</text>
    <text x="98" y="146" font-size="11" fill="#C9D8E8">over HTTPS</text>

    <rect x="208" y="70" width="170" height="96" rx="10" fill="#FFF4EA" stroke="#E2702B" stroke-width="2"/>
    <text x="293" y="96" font-size="11" font-weight="700" fill="#B4521A" letter-spacing="1">LEVEL 4</text>
    <text x="293" y="116" font-size="13" font-weight="700" fill="#0E2233">CloudFront Function</text>
    <text x="293" y="138" font-size="10.5" fill="#B4521A" font-family="Menlo, Consolas, monospace">/about →</text>
    <text x="293" y="154" font-size="10.5" fill="#B4521A" font-family="Menlo, Consolas, monospace">/about/index.html</text>

    <rect x="418" y="70" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#5B7186" stroke-width="2"/>
    <text x="493" y="96" font-size="11" font-weight="700" fill="#5B7186" letter-spacing="1">LEVEL 5</text>
    <text x="493" y="116" font-size="13" font-weight="700" fill="#0E2233">Edge cache</text>
    <text x="493" y="138" font-size="11" fill="#22703F">Hit → answer now</text>
    <text x="493" y="154" font-size="11" fill="#B4521A">Miss → ask S3</text>

    <rect x="608" y="70" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/>
    <text x="683" y="96" font-size="11" font-weight="700" fill="#22703F" letter-spacing="1">LEVEL 2</text>
    <text x="683" y="116" font-size="13" font-weight="700" fill="#0E2233">OAC signs</text>
    <text x="683" y="138" font-size="11" fill="#3E5468">request with</text>
    <text x="683" y="154" font-size="11" fill="#3E5468">CloudFront's identity</text>

    <rect x="798" y="70" width="134" height="96" rx="10" fill="#EAF6EF" stroke="#2E8B57" stroke-width="2"/>
    <text x="865" y="102" font-size="13" font-weight="700" fill="#22703F">Private S3</text>
    <text x="865" y="124" font-size="11" fill="#22703F">policy: only</text>
    <text x="865" y="140" font-size="11" fill="#22703F">dist E2ABC…</text>
  </g>
  <g stroke="#5B7186" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="168" y1="118" x2="204" y2="118"/><line x1="378" y1="118" x2="414" y2="118"/>
    <line x1="568" y1="118" x2="604" y2="118"/><line x1="758" y1="118" x2="794" y2="118"/>
  </g>
  <path d="M865,166 C865,240 98,240 98,170" fill="none" stroke="#2E8B57" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arg)"/>
  <text x="480" y="232" font-size="12" fill="#22703F" text-anchor="middle">response is cached at the edge on the way back (+ security headers, Level 4)</text>
  <text x="480" y="272" font-size="12.5" fill="#3E5468" text-anchor="middle">Object missing? S3 says <tspan font-weight="700" fill="#A23024">403</tspan>, not 404, and CloudFront swaps in 404.html (Level 3).</text>
</svg>
