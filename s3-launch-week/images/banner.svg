<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 300" font-family="'Courier New', Courier, monospace" role="img" aria-label="Arcade Launch Week: S3 Lab 2">
  <rect width="960" height="300" rx="18" fill="#120B2E"/>
