  <g fill="#FFD23F"><rect x="80" y="40" width="4" height="4"/><rect x="230" y="70" width="3" height="3"/><rect x="760" y="40" width="4" height="4"/><rect x="880" y="96" width="3" height="3"/><rect x="620" y="24" width="3" height="3"/></g>
