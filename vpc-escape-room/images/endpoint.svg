<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Private route table with a prefix-list route to the S3 gateway endpoint and a default route to the NAT gateway; S3 traffic takes the endpoint">
  <defs>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B7186"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0E2233">The secret passage: most specific route wins</text>

  <rect x="40" y="70" width="170" height="90" rx="10" fill="#E8F0FA" stroke="#1F5FAE" stroke-width="2"/>
  <text x="125" y="104" font-size="14" font-weight="700" fill="#1F5FAE" text-anchor="middle">Private EC2</text>
  <text x="125" y="126" font-size="11" fill="#3E5468" text-anchor="middle" font-family="Menlo, Consolas, monospace">10.0.100.x</text>

  <!-- route table -->
  <rect x="270" y="62" width="380" height="150" rx="10" fill="#FFFFFF" stroke="#0E2233" stroke-width="2"/>
  <text x="290" y="88" font-size="13" font-weight="700" fill="#0E2233">Private route table</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12">
    <text x="290" y="114" fill="#5B7186">DESTINATION        TARGET</text>
    <text x="290" y="138" fill="#0E2233">10.0.0.0/16        local</text>
    <rect x="282" y="148" width="356" height="24" rx="4" fill="#EAF6EF"/>
    <text x="290" y="165" fill="#22703F" font-weight="700">pl-68a54001 (S3)   vpce-…  ← new</text>
    <text x="290" y="194" fill="#0E2233">0.0.0.0/0          nat-…</text>
  </g>

  <!-- destinations -->
  <rect x="720" y="62" width="210" height="80" rx="10" fill="#EAF6EF" stroke="#2E8B57" stroke-width="2"/>
  <text x="825" y="94" font-size="14" font-weight="700" fill="#22703F" text-anchor="middle">Amazon S3</text>
  <text x="825" y="116" font-size="11" fill="#22703F" text-anchor="middle">free · stays on AWS network</text>
  <rect x="720" y="170" width="210" height="80" rx="10" fill="#FFFFFF" stroke="#5B7186" stroke-width="2"/>
  <text x="825" y="202" font-size="14" font-weight="700" fill="#3E5468" text-anchor="middle">NAT gateway → internet</text>
  <text x="825" y="224" font-size="11" fill="#5B7186" text-anchor="middle">billed per GB processed</text>

  <line x1="210" y1="115" x2="266" y2="115" stroke="#5B7186" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M638,160 C680,160 680,102 716,102" fill="none" stroke="#2E8B57" stroke-width="3" marker-end="url(#arg)"/>
  <path d="M638,190 C680,190 680,210 716,210" fill="none" stroke="#5B7186" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <rect x="40" y="262" width="890" height="48" rx="10" fill="#0E2233"/>
  <text x="60" y="291" font-size="13" fill="#C9D8E8">A packet to S3 matches both <tspan font-family="Menlo, Consolas, monospace" fill="#9ACDB0">pl-…</tspan> and <tspan font-family="Menlo, Consolas, monospace" fill="#FFD27A">0.0.0.0/0</tspan>. The prefix list is more specific, so it wins. (Your pl- ID may differ.)</text>
</svg>
