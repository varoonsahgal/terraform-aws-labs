<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 260" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Security group chaining: internet to ALB security group on port 80, ALB security group to app security group on port 80; anything else is dropped">
  <defs>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E2702B"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0E2233">Security group chaining: allow the badge, not the address</text>

  <rect x="40" y="80" width="170" height="70" rx="35" fill="#0E2233"/>
  <text x="125" y="120" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Anyone</text>

  <rect x="340" y="70" width="240" height="90" rx="10" fill="#FFF4EA" stroke="#E2702B" stroke-width="2.5"/>
  <text x="460" y="100" font-size="15" font-weight="700" fill="#B4521A" text-anchor="middle">ALB</text>
  <rect x="372" y="114" width="176" height="28" rx="14" fill="#E2702B"/>
  <text x="460" y="133" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">badge: user07-alb-sg</text>

  <rect x="710" y="70" width="210" height="90" rx="10" fill="#E8F0FA" stroke="#1F5FAE" stroke-width="2.5"/>
  <text x="815" y="100" font-size="15" font-weight="700" fill="#1F5FAE" text-anchor="middle">App instances</text>
  <text x="815" y="122" font-size="11.5" fill="#0E2233" text-anchor="middle" font-family="Menlo, Consolas, monospace">user07-app-sg</text>
  <text x="815" y="142" font-size="11" fill="#1F5FAE" text-anchor="middle" font-family="Menlo, Consolas, monospace">in: 80 from alb-sg</text>

  <line x1="210" y1="115" x2="336" y2="115" stroke="#E2702B" stroke-width="3" marker-end="url(#aro)"/>
  <text x="273" y="106" font-size="12" fill="#B4521A" text-anchor="middle" font-family="Menlo, Consolas, monospace">:80</text>
  <line x1="580" y1="115" x2="706" y2="115" stroke="#E2702B" stroke-width="3" marker-end="url(#aro)"/>
  <text x="643" y="106" font-size="12" fill="#B4521A" text-anchor="middle" font-family="Menlo, Consolas, monospace">:80 ✓</text>

  <!-- blocked path -->
  <path d="M125,150 C125,220 600,226 742,170" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <circle cx="742" cy="186" r="14" fill="#C0392B"/>
  <path d="M735,179 L749,193 M749,179 L735,193" stroke="#FFFFFF" stroke-width="3"/>
  <text x="430" y="230" font-size="13" fill="#A23024" text-anchor="middle">Direct to the app? No public IP to reach, and no badge even if there were.</text>
</svg>
