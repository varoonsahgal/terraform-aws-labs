<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: internet to ALB in public subnets, ASG instances in private subnets, NAT gateway for outbound, S3 gateway endpoint, flow logs">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B7186"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E2702B"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="518" rx="16" fill="#F5F8FB" stroke="#D3DEEA" stroke-width="2"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#0E2233">What you will build in your VPC-Lab (example: user07)</text>

  <!-- internet -->
  <rect x="310" y="56" width="200" height="40" rx="20" fill="#0E2233"/>
  <text x="410" y="81" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Internet</text>

  <!-- VPC -->
  <rect x="30" y="118" width="760" height="380" rx="14" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="2"/>
  <text x="46" y="140" font-size="12" font-weight="700" fill="#1F5FAE" letter-spacing="1">user07-VPC-Lab · 10.0.0.0/16</text>
  <rect x="370" y="108" width="80" height="22" rx="4" fill="#1F5FAE"/>
  <text x="410" y="123" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">IGW</text>

  <!-- AZ columns -->
  <rect x="50" y="152" width="350" height="330" rx="10" fill="none" stroke="#9FB4C8" stroke-dasharray="6 5"/>
  <text x="62" y="170" font-size="11" fill="#5B7186">us-west-2a</text>
  <rect x="420" y="152" width="350" height="330" rx="10" fill="none" stroke="#9FB4C8" stroke-dasharray="6 5"/>
  <text x="432" y="170" font-size="11" fill="#5B7186">us-west-2b</text>

  <!-- public subnets -->
  <rect x="64" y="180" width="322" height="104" rx="8" fill="#EAF6EF" stroke="#2E8B57"/>
  <text x="76" y="198" font-size="11.5" font-weight="700" fill="#22703F">public · 10.0.10.0/24</text>
  <rect x="434" y="180" width="322" height="104" rx="8" fill="#EAF6EF" stroke="#2E8B57"/>
  <text x="446" y="198" font-size="11.5" font-weight="700" fill="#22703F">public · 10.0.20.0/24</text>

  <!-- ALB spanning -->
  <rect x="180" y="212" width="480" height="44" rx="8" fill="#FFF4EA" stroke="#E2702B" stroke-width="2.5"/>
  <text x="420" y="232" font-size="13" font-weight="700" fill="#B4521A" text-anchor="middle">ALB  user07-alb</text>
  <text x="420" y="248" font-size="11" fill="#B4521A" text-anchor="middle" font-family="Menlo, Consolas, monospace">sg: user07-alb-sg (80 from 0.0.0.0/0)</text>

  <!-- NAT -->
  <rect x="80" y="236" width="86" height="38" rx="6" fill="#FFFFFF" stroke="#5B7186"/>
  <text x="123" y="252" font-size="11" font-weight="700" fill="#3E5468" text-anchor="middle">NAT GW</text>
  <text x="123" y="266" font-size="10" fill="#5B7186" text-anchor="middle">EIP</text>

  <!-- private subnets -->
  <rect x="64" y="300" width="322" height="168" rx="8" fill="#E8F0FA" stroke="#1F5FAE"/>
  <text x="76" y="318" font-size="11.5" font-weight="700" fill="#1F5FAE">private · 10.0.100.0/24</text>
  <rect x="434" y="300" width="322" height="168" rx="8" fill="#E8F0FA" stroke="#1F5FAE"/>
  <text x="446" y="318" font-size="11.5" font-weight="700" fill="#1F5FAE">private · 10.0.200.0/24</text>

  <!-- ASG -->
  <rect x="150" y="332" width="520" height="92" rx="10" fill="none" stroke="#0E2233" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="410" y="414" font-size="11" fill="#0E2233" text-anchor="middle">ASG user07-app-asg · 2/2/2 · sg: user07-app-sg (80 from alb-sg only)</text>
  <rect x="190" y="344" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="2"/>
  <text x="250" y="366" font-size="12" font-weight="700" fill="#0E2233" text-anchor="middle">EC2 app</text>
  <text x="250" y="384" font-size="10" fill="#5B7186" text-anchor="middle">no public IP</text>
  <rect x="510" y="344" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="2"/>
  <text x="570" y="366" font-size="12" font-weight="700" fill="#0E2233" text-anchor="middle">EC2 app</text>
  <text x="570" y="384" font-size="10" fill="#5B7186" text-anchor="middle">no public IP</text>

  <!-- NACL badge -->
  <rect x="76" y="432" width="300" height="26" rx="6" fill="#FBECEA" stroke="#C0392B"/>
  <text x="226" y="449" font-size="11" font-weight="700" fill="#A23024" text-anchor="middle">Room 4: user07-strict-nacl on private subnets</text>
  <rect x="446" y="432" width="300" height="26" rx="6" fill="#FBECEA" stroke="#C0392B"/>
  <text x="596" y="449" font-size="11" font-weight="700" fill="#A23024" text-anchor="middle">Room 4: user07-strict-nacl on private subnets</text>

  <!-- right column services -->
  <rect x="812" y="150" width="128" height="88" rx="10" fill="#EAF6EF" stroke="#2E8B57" stroke-width="2"/>
  <text x="876" y="176" font-size="13" font-weight="700" fill="#22703F" text-anchor="middle">Amazon S3</text>
  <text x="876" y="196" font-size="10.5" fill="#22703F" text-anchor="middle">via gateway</text>
  <text x="876" y="211" font-size="10.5" fill="#22703F" text-anchor="middle">endpoint (Room 5)</text>
  <rect x="812" y="258" width="128" height="88" rx="10" fill="#FFFFFF" stroke="#5B7186" stroke-width="2"/>
  <text x="876" y="284" font-size="13" font-weight="700" fill="#0E2233" text-anchor="middle">Systems</text>
  <text x="876" y="300" font-size="13" font-weight="700" fill="#0E2233" text-anchor="middle">Manager</text>
  <text x="876" y="320" font-size="10.5" fill="#5B7186" text-anchor="middle">Room 3 shell</text>
  <rect x="812" y="366" width="128" height="88" rx="10" fill="#FFFFFF" stroke="#5B7186" stroke-width="2"/>
  <text x="876" y="392" font-size="13" font-weight="700" fill="#0E2233" text-anchor="middle">CloudWatch</text>
  <text x="876" y="408" font-size="13" font-weight="700" fill="#0E2233" text-anchor="middle">Logs</text>
  <text x="876" y="428" font-size="10.5" fill="#5B7186" text-anchor="middle">flow logs (Room 0)</text>

  <!-- arrows -->
  <line x1="410" y1="96" x2="410" y2="106" stroke="#5B7186" stroke-width="2"/>
  <path d="M410,130 L410,210" stroke="#E2702B" stroke-width="2.5" marker-end="url(#aro)"/>
  <path d="M330,256 C330,300 260,300 252,342" fill="none" stroke="#E2702B" stroke-width="2.5" marker-end="url(#aro)"/>
  <path d="M510,256 C510,300 560,300 568,342" fill="none" stroke="#E2702B" stroke-width="2.5" marker-end="url(#aro)"/>
  <path d="M190,360 C130,360 123,320 123,276" fill="none" stroke="#5B7186" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="172" y="295" font-size="10.5" fill="#3E5468">outbound via NAT</text>
  <path d="M630,370 C760,370 760,200 808,196" fill="none" stroke="#2E8B57" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>
</svg>
